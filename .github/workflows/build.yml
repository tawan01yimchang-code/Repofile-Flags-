name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find Gradle project folder
        id: find
        run: |
          f=$(find . -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -1)
          if [ -z "$f" ]; then
            for z in $(find . -maxdepth 2 -name '*.zip'); do echo "Unzipping $z"; unzip -oq "$z" -d _unzipped; done
            f=$(find . -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -1)
          fi
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle(.kts) found in this repo. Upload the project files (not the zip) to the repo."
            ls -R | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - name: Build debug APK
        run: gradle -p "${{ steps.find.outputs.dir }}" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Win10Launcher-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
