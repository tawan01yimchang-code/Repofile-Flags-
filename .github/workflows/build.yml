name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q PureLock.zip -d project
          D=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          echo "Project dir: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          sed -i '/android.useAndroidX/d' "$D/gradle.properties"
          echo "android.useAndroidX=true" >> "$D/gradle.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: mv ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/Pure Lock.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pure Lock
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
